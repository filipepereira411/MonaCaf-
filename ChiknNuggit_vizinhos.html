<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chikn Nuggit - Edição Pôr do Sol</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #18181b;
      gap: 16px;
    }

    /* Botões de controlo das cenas */
    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: 3px solid #1a1817;
      border-radius: 12px;
      background-color: #fce883;
      color: #1a1817;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background-color: #fde047;
      transform: translateY(-2px);
    }

    button.active {
      background-color: #fb923c;
      color: #ffffff;
    }

    /* Contentor principal da cena */
    .canvas {
      position: relative;
      width: 340px;
      height: 560px;
      overflow: hidden;
      border-radius: 18px;
      border: 4px solid #1a1817;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transition: background 0.5s ease;
    }

    /* ================= CENA 1: BANHO (BANDA DILDOS) ================= */
    .scene-bath {
      background-color: #bae6fd;
      background-image: linear-gradient(to right, rgba(255,255,255,0.4) 2px, transparent 2px),
                        linear-gradient(to bottom, rgba(255,255,255,0.4) 2px, transparent 2px);
      background-size: 40px 40px;
    }

    /* Poster da banda Dildos na parede do banho */
    .band-poster {
      position: absolute;
      top: 40px;
      right: 25px;
      width: 115px;
      height: 145px;
      background-color: #fef08a;
      border: 3px solid #1a1817;
      padding: 8px;
      text-align: center;
      transform: rotate(4deg);
      box-shadow: 4px 4px 0px #1a1817;
      z-index: 1;
    }

    .band-poster h4 {
      font-size: 11px;
      text-transform: uppercase;
      color: #dc2626;
      margin-bottom: 4px;
    }

    .band-poster .band-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #1a1817;
      background: #fb923c;
      padding: 2px;
      border: 2px solid #1a1817;
    }

    .band-poster p {
      font-size: 9px;
      margin-top: 6px;
      font-weight: bold;
    }

    /* Chuveiro e água */
    .shower-pipe {
      position: absolute;
      top: 30px;
      left: 0;
      width: 130px;
      height: 12px;
      background-color: #94a3b8;
      border-top: 3px solid #1a1817;
      border-bottom: 3px solid #1a1817;
      z-index: 5;
    }

    .shower-head {
      position: absolute;
      top: 25px;
      left: 125px;
      width: 35px;
      height: 25px;
      background-color: #cbd5e1;
      border: 3px solid #1a1817;
      border-radius: 0 20px 20px 0;
      transform: rotate(35deg);
      z-index: 6;
    }

    .water-stream {
      position: absolute;
      top: 50px;
      left: 110px;
      width: 130px;
      height: 360px;
      background: repeating-linear-gradient(
        105deg,
        rgba(56, 189, 248, 0.5),
        rgba(56, 189, 248, 0.5) 4px,
        transparent 4px,
        transparent 14px
      );
      z-index: 6;
      pointer-events: none;
    }

    /* Banheira */
    .bathtub {
      position: absolute;
      bottom: 0;
      left: -10px;
      width: 360px;
      height: 155px;
      background-color: #ffffff;
      border-top: 5px solid #1a1817;
      border-radius: 20px 20px 0 0;
      z-index: 5;
    }

    .bubbles {
      position: absolute;
      bottom: 140px;
      left: 10px;
      width: 320px;
      height: 45px;
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 40px;
      z-index: 4;
    }

    /* ================= CENA 2: BARBA (VIZINHOS PÔR DO SOL) ================= */
    .scene-shave {
      background: linear-gradient(180deg, #7c2d12 0%, #ea580c 45%, #facc15 80%, #fef08a 100%);
    }

    /* Sol gigante ao fundo */
    .sunset-sun {
      position: absolute;
      top: 130px;
      left: 70px;
      width: 200px;
      height: 200px;
      background-color: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 40px #fde047;
      z-index: 1;
    }

    /* Silhueta dos Vizinhos (Herdade do Pôr do Sol) */
    .neighbors {
      position: absolute;
      bottom: 130px;
      right: 18px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      z-index: 2;
    }

    .neighbor {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .neighbor-head {
      width: 26px;
      height: 26px;
      background-color: #431407;
      border-radius: 50%;
    }

    .neighbor-body {
      width: 38px;
      height: 55px;
      background-color: #431407;
      border-radius: 15px 15px 0 0;
      margin-top: 2px;
    }

    .fence {
      position: absolute;
      bottom: 120px;
      left: 0;
      width: 100%;
      height: 20px;
      background-color: #431407;
      z-index: 2;
    }

    /* Lavatório exterior / varanda */
    .sink {
      position: absolute;
      bottom: 0;
      left: -15px;
      width: 370px;
      height: 125px;
      background-color: #f8fafc;
      border-top: 4px solid #1a1817;
      border-radius: 35% 35% 0 0;
      z-index: 5;
    }

    /* ================= PERSONAGEM CHIKN NUGGIT ================= */
    .character {
      position: absolute;
      top: 175px;
      left: 65px;
      width: 210px;
      height: 300px;
      z-index: 3;
    }

    .ear {
      position: absolute;
      background-color: #fce883;
      border: 4px solid #1a1817;
      z-index: 2;
    }
    .ear-left {
      width: 58px;
      height: 210px;
      top: 75px;
      left: -30px;
      border-radius: 40px 20px 50px 50px;
      transform: rotate(14deg);
    }
    .ear-right {
      width: 58px;
      height: 210px;
      top: 75px;
      right: -10px;
      border-radius: 20px 40px 50px 50px;
      transform: rotate(-14deg);
    }

    .head {
      position: absolute;
      top: 0;
      left: 18px;
      width: 170px;
      height: 160px;
      background-color: #fce883;
      border: 4px solid #1a1817;
      border-radius: 50%;
      z-index: 4;
    }

    .eye {
      position: absolute;
      background-color: #1a1817;
      top: 62px;
    }

    /* Olhos relaxados no banho */
    .scene-bath .eye {
      width: 38px;
      height: 7px;
      border-radius: 10px;
    }
    .scene-bath .eye-left { left: 26px; transform: rotate(-10deg); }
    .scene-bath .eye-right { right: 26px; transform: rotate(10deg); }

    /* Olhos abertos a fazer a barba */
    .scene-shave .eye {
      width: 22px;
      height: 26px;
      border-radius: 50%;
    }
    .scene-shave .eye-left { left: 36px; }
    .scene-shave .eye-right { right: 36px; }

    .nose {
      position: absolute;
      top: 80px;
      left: 78px;
      width: 14px;
      height: 9px;
      background-color: #1a1817;
      border-radius: 50%;
      z-index: 6;
    }

    .mouth {
      position: absolute;
      top: 86px;
      left: 71px;
      width: 28px;
      height: 12px;
      display: flex;
      justify-content: center;
      z-index: 6;
    }
    .mouth::before, .mouth::after {
      content: "";
      width: 12px;
      height: 8px;
      border-bottom: 3px solid #1a1817;
      border-left: 3px solid #1a1817;
      border-right: 3px solid #1a1817;
      border-radius: 0 0 10px 10px;
    }

    /* Espuma de barbear */
    .shaving-foam {
      position: absolute;
      bottom: 6px;
      left: 20px;
      width: 122px;
      height: 58px;
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 30px 30px 55px 55px;
      z-index: 5;
    }

    /* Espuma na cabeça durante o banho */
    .shampoo-foam {
      position: absolute;
      top: -18px;
      left: 35px;
      width: 100px;
      height: 36px;
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 50%;
      z-index: 6;
    }

    .torso {
      position: absolute;
      top: 148px;
      left: 48px;
      width: 110px;
      height: 140px;
      background-color: #fce883;
      border-left: 4px solid #1a1817;
      border-right: 4px solid #1a1817;
      border-radius: 30% 30% 0 0;
      z-index: 3;
    }

    /* Braço e lâmina */
    .arm-shaving {
      position: absolute;
      top: 142px;
      right: 12px;
      width: 62px;
      height: 22px;
      background-color: #fce883;
      border: 4px solid #1a1817;
      border-radius: 20px;
      transform: rotate(-35deg);
      z-index: 6;
    }

    .razor {
      position: absolute;
      top: 96px;
      right: 44px;
      width: 28px;
      height: 12px;
      background-color: #64748b;
      border: 3px solid #1a1817;
      border-radius: 4px;
      transform: rotate(-20deg);
      z-index: 8;
    }
    .razor::after {
      content: "";
      position: absolute;
      top: 9px;
      left: 8px;
      width: 8px;
      height: 45px;
      background-color: #ef4444;
      border: 3px solid #1a1817;
      border-radius: 4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="btn-bath" class="active" onclick="setScene('bath')">1. Tomar Banho (Dildos)</button>
    <button id="btn-shave" onclick="setScene('shave')">2. Fazer a Barba (Pôr do Sol)</button>
  </div>

  <div id="scene-canvas" class="canvas scene-bath">
    
    <!-- Elementos da Cena 1: Banho -->
    <div id="bath-elements">
      <div class="band-poster">
        <h4>Ao Vivo</h4>
        <div class="band-name">DILDOS</div>
        <p>Herdade do Pôr do Sol</p>
      </div>
      <div class="shower-pipe"></div>
