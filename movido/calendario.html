<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <title>Calendário — Mona Café</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e9;
      --ink: #25291f;
      --muted: #737366;
      --green: #344b38;
      --orange: #d66e43;
      --line: #ded8cb;
      --serif: Georgia, "Times New Roman", serif;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    .wrap { width: min(980px, calc(100% - 48px)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--line); }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font: 700 25px var(--serif); letter-spacing: -.04em; text-decoration: none; }
    .brand span { color: var(--orange); }
    .back { font-size: 14px; font-weight: 700; text-underline-offset: 5px; }
    main { padding-block: 52px 76px; }
    .eyebrow { margin-bottom: 10px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 12px; font: 400 clamp(42px, 6vw, 64px)/1 var(--serif); letter-spacing: -.05em; }
    .lede { max-width: 570px; margin-bottom: 30px; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .calendar { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(250px, .75fr); border: 1px solid var(--line); background: #fbf8f2; }
    .month-panel { padding: 26px; }
    .month-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .month-head h2 { margin: 0; font: 400 27px var(--serif); }
    .controls { display: flex; gap: 8px; }
    .icon-button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer; font-size: 18px; }
    .icon-button:hover, .icon-button:focus-visible { border-color: var(--green); outline: 2px solid #344b3840; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
    .weekdays { margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .day { position: relative; display: grid; min-height: 53px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
    .day:hover { background: #e9e2d4; }
    .day.outside { color: #aaa99f; }
    .day.today { outline: 1px solid var(--orange); outline-offset: -5px; }
    .day.selected { background: var(--green); color: white; }
    .day.has-event::after { position: absolute; bottom: 5px; left: calc(50% - 3px); width: 6px; height: 6px; border-radius: 50%; background: var(--orange); content: ""; }
    .day.selected.has-event::after { background: white; }
    .calendar-side { padding: 28px 24px; border-left: 1px solid var(--line); background: #e9e2d4; }
    .calendar-side h2 { margin-bottom: 6px; font: 400 25px var(--serif); }
    .selected-date { margin-bottom: 22px; color: var(--muted); font-size: 13px; }
    .event { padding: 15px 0; border-top: 1px solid #d5cdbd; }
    .event time { color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .event h3 { margin: 7px 0 5px; font: 400 19px var(--serif); }
    .event p, .empty { margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .empty { padding: 17px 0; border-top: 1px solid #d5cdbd; }
    .legend { display: flex; align-items: center; gap: 8px; margin-top: 17px; color: var(--muted); font-size: 12px; }
    .legend::before { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); content: ""; }
    footer { padding: 22px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 18px; }
    @media (max-width: 680px) {
      .wrap { width: min(100% - 32px, 520px); }
      .nav { min-height: 68px; }
      main { padding-top: 40px; }
      .calendar { grid-template-columns: 1fr; }
      .month-panel { padding: 18px 14px 22px; }
      .calendar-side { min-height: 190px; border-top: 1px solid var(--line); border-left: 0; }
      .day { min-height: 46px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="wrap nav" aria-label="Navegação principal">
      <a class="brand" href="site.html">mona<span>.</span></a>
      <a class="back" href="site.html">← Voltar ao café</a>
    </nav>
  </header>

  <main class="wrap">
    <p class="eyebrow">Guarda a data</p>
    <h1>Coisas boas acontecem aqui.</h1>
    <p class="lede">Escolhe um dia para ver o que está marcado. Todas as semanas há uma desculpa para passar pela Mona.</p>

    <section class="calendar" aria-label="Calendário de eventos">
      <div class="month-panel">
        <div class="month-head">
          <h2 id="month-label" aria-live="polite"></h2>
          <div class="controls">
            <button class="icon-button" id="previous" type="button" aria-label="Mês anterior">‹</button>
            <button class="icon-button" id="today" type="button" aria-label="Ir para hoje">•</button>
            <button class="icon-button" id="next" type="button" aria-label="Mês seguinte">›</button>
          </div>
        </div>
        <div class="weekdays" aria-hidden="true">
          <span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span>
        </div>
        <div class="days" id="days" role="grid" aria-label="Dias do mês"></div>
        <div class="legend">Dia com evento</div>
      </div>
      <aside class="calendar-side" aria-live="polite" aria-labelledby="agenda-title">
        <p class="eyebrow">Na agenda</p>
        <h2 id="agenda-title"></h2>
        <p class="selected-date" id="selected-date"></p>
        <div id="events"></div>
      </aside>
    </section>
  </main>

  <footer><div class="wrap"><span>© Mona Café · Lisboa.</span><a href="site.html">Conhecer o café</a></div></footer>

  <script>
    const now = new Date();
    let displayedMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const monthLabel = document.getElementById("month-label");
    const daysElement = document.getElementById("days");
    const eventsElement = document.getElementById("events");
    const agendaTitle = document.getElementById("agenda-title");
    const selectedDateLabel = document.getElementById("selected-date");
    const monthFormatter = new Intl.DateTimeFormat("pt-PT", { month: "long", year: "numeric" });
    const dateFormatter = new Intl.DateTimeFormat("pt-PT", { weekday: "long", day: "numeric", month: "long" });

    function eventsFor(date) {
      switch (date.getDay()) {
        case 0: return [{ time: "11:00", title: "Leitura à mesa", detail: "Traz um livro, escolhe um café e fica o tempo que quiseres." }];
        case 4: return [{ time: "17:00", title: "Prova de cafés", detail: "Uma prova descontraída de cafés de origem diferente. Lugares limitados." }];
        case 6: return [{ time: "10:00", title: "Brunch de sábado", detail: "Pão quente, coisas da época e café sem pressa." }];
        default: return [];
      }
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function renderAgenda() {
      const readableDate = dateFormatter.format(selectedDate);
      agendaTitle.textContent = eventsFor(selectedDate).length ? "Um dia bem passado." : "Um dia tranquilo.";
      selectedDateLabel.textContent = readableDate.charAt(0).toUpperCase() + readableDate.slice(1);
      const events = eventsFor(selectedDate);
      eventsElement.replaceChildren();
      if (events.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Sem eventos marcados. Ainda assim, há sempre café à tua espera.";
        eventsElement.append(empty);
        return;
      }
      for (const item of events) {
        const article = document.createElement("article");
        article.className = "event";
        const time = document.createElement("time");
        time.textContent = item.time;
        const title = document.createElement("h3");
        title.textContent = item.title;
        const detail = document.createElement("p");
        detail.textContent = item.detail;
        article.append(time, title, detail);
        eventsElement.append(article);
      }
    }

    function renderCalendar() {
      monthLabel.textContent = monthFormatter.format(displayedMonth);
      daysElement.replaceChildren();
      const firstDay = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth(), 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const gridStart = new Date(firstDay.getFullYear(), firstDay.getMonth(), 1 - startOffset);

      for (let index = 0; index < 42; index++) {
        const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + index);
        const day = document.createElement("button");
        day.type = "button";
        day.className = "day";
        day.setAttribute("role", "gridcell");
        day.textContent = String(date.getDate());
        day.setAttribute("aria-label", dateFormatter.format(date));
        if (date.getMonth() !== displayedMonth.getMonth()) day.classList.add("outside");
        if (sameDay(date, now)) day.classList.add("today");
        if (sameDay(date, selectedDate)) {
          day.classList.add("selected");
          day.setAttribute("aria-pressed", "true");
        } else {
          day.setAttribute("aria-pressed", "false");
        }
        if (eventsFor(date).length) day.classList.add("has-event");
        day.addEventListener("click", () => {
          selectedDate = date;
          displayedMonth = new Date(date.getFullYear(), date.getMonth(), 1);
          renderCalendar();
          renderAgenda();
        });
        daysElement.append(day);
      }
    }

    document.getElementById("previous").addEventListener("click", () => {
      displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() - 1, 1);
      renderCalendar();
    });
    document.getElementById("next").addEventListener("click", () => {
      displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 1);
      renderCalendar();
    });
    document.getElementById("today").addEventListener("click", () => {
      displayedMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      renderCalendar();
      renderAgenda();
    });

    renderCalendar();
    renderAgenda();
  </script>
</body>
</html>
