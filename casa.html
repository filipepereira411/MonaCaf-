<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A minha casa — Estr. dos Luízes 17, Pontével</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e9; --ink: #25291f; --muted: #737366; --green: #344b38; --orange: #d66e43; --line: #ded8cb;
      --serif: Georgia, "Times New Roman", serif;
      font-family: "Trebuchet MS", Arial, sans-serif; color: var(--ink); background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .wrap { width: min(860px, calc(100% - 32px)); margin-inline: auto; padding-block: 48px 64px; }
    .eyebrow { margin: 0 0 10px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font: 400 clamp(36px, 6vw, 56px)/1.05 var(--serif); letter-spacing: -.04em; }
    .lede { margin: 0 0 28px; color: var(--muted); line-height: 1.7; }
    .card { border: 1px solid var(--line); background: #fbf8f2; }
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 32px; padding: 24px; }
    .info dt { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .info dd { margin: 4px 0 0; font-size: 16px; }
    iframe { display: block; width: 100%; height: 380px; border: 0; border-top: 1px solid var(--line); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .button { display: inline-flex; min-height: 46px; align-items: center; padding: 0 20px; border-radius: 4px; background: var(--green); color: #fff; font-weight: 700; text-decoration: none; }
    .button:hover { background: #243629; }
    .button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    @media (max-width: 560px) { .info { grid-template-columns: 1fr; } iframe { height: 300px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">A minha casa</p>
    <h1>Estr. dos Luízes, 17<br>Pontével</h1>
    <p class="lede">Casa branca de telhado vermelho, com portão verde e muros cobertos de hera, ao fundo de um caminho de terra.</p>

    <section class="card" aria-label="Localização">
      <dl class="info">
        <div><dt>Morada</dt><dd>Estr. dos Luízes 17, Pontével</dd></div>
        <div><dt>Código postal</dt><dd>2070-388</dd></div>
        <div><dt>Concelho</dt><dd>Cartaxo</dd></div>
        <div><dt>Coordenadas</dt><dd>39.1460, -8.8794</dd></div>
      </dl>
      <iframe title="Mapa da localização" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
        src="https://maps.google.com/maps?q=39.1459787,-8.8794049&z=17&output=embed"></iframe>
    </section>

    <div class="actions">
      <a class="button" href="https://www.google.com/maps/dir/?api=1&destination=39.1459787,-8.8794049" target="_blank" rel="noopener">Como chegar</a>
      <a class="button ghost" href="https://www.google.com/maps/search/?api=1&query=39.1459787,-8.8794049" target="_blank" rel="noopener">Abrir no Google Maps</a>
    </div>
  </main>
</body>
</html>
